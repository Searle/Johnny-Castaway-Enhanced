<html>

<head>
  <meta charset="utf-8" />
  <script src="wasm_exec.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* #stage fills the viewport and centers the canvas. The canvas fills the
       stage and letterboxes its rendered pixels via object-fit: contain, while
       keeping its own drawing-buffer resolution (the width/height attributes,
       which raylib/emscripten manage). Sizing is pure CSS on the wrapper, so
       there is no JS polling of the canvas style to fight emscripten. */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; /* crisp upscaling of the pixel-art scene */
    }
  </style>
</head>

<body>
  <div id="stage">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>
  <script type="module" src="./index.js"></script>
</body>

</html>
