<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johnny Castaway — TS slice</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #ccc;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      canvas {
        image-rendering: pixelated;
        width: min(90vw, 960px);
        aspect-ratio: 640 / 480;
        background: #000;
        border: 1px solid #333;
      }
      #hud { font-size: 12px; opacity: 0.6; font-variant-numeric: tabular-nums; }
      #controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 13px;
      }
      #controls label { opacity: 0.7; }
      select, button {
        background: #1c1c1c;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 3px 6px;
        font: inherit;
      }
      button { cursor: pointer; }
      button:hover { background: #2a2a2a; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="controls">
        <label>mode
          <select id="mode">
            <option value="ttm">TTM scene</option>
            <option value="ads">ADS script</option>
            <option value="story">screensaver</option>
          </select>
        </label>
        <span id="ttmControls">
          <label>animation
            <select id="ttm"></select>
          </label>
          <label>tag
            <select id="tag"></select>
          </label>
        </span>
        <span id="adsControls" hidden>
          <label>script
            <select id="ads"></select>
          </label>
          <label>entry
            <select id="adsTag"></select>
          </label>
        </span>
        <span id="storyControls" hidden>
          <label>day
            <select id="storyDay"></select>
          </label>
          <label>tide
            <select id="storyTide">
              <option value="auto">auto</option>
              <option value="high">high</option>
              <option value="low">low</option>
            </select>
          </label>
          <label>sky
            <select id="storySky">
              <option value="auto">auto</option>
              <option value="day">day</option>
              <option value="night">night</option>
            </select>
          </label>
          <label>holiday
            <select id="storyHoliday">
              <option value="auto">auto</option>
              <option value="0">none</option>
              <option value="1">halloween</option>
              <option value="2">st patrick</option>
              <option value="3">christmas</option>
              <option value="4">new year</option>
            </select>
          </label>
          <label>pos
            <select id="storyPos">
              <option value="auto">auto</option>
              <option value="0">centered</option>
            </select>
          </label>
          <button id="storyNext" title="Skip to the next scene">⏭ next</button>
        </span>
        <button id="restart" title="Replay from the start">↻ restart</button>
      </div>
      <canvas id="screen" width="640" height="480"></canvas>
      <div id="hud">loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
