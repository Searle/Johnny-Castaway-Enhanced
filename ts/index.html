<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johnny Castaway — TS slice</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #ccc;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      canvas {
        image-rendering: pixelated;
        width: min(90vw, 960px);
        aspect-ratio: 640 / 480;
        background: #000;
        border: 1px solid #333;
      }
      #hud { font-size: 12px; opacity: 0.6; font-variant-numeric: tabular-nums; }
      #controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 13px;
      }
      #controls label { opacity: 0.7; }
      select, button {
        background: #1c1c1c;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 3px 6px;
        font: inherit;
      }
      button { cursor: pointer; }
      button:hover { background: #2a2a2a; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="controls">
        <label>animation
          <select id="ttm"></select>
        </label>
        <label>tag
          <select id="tag"></select>
        </label>
        <button id="restart" title="Replay from the current scene tag">↻ restart</button>
      </div>
      <canvas id="screen" width="640" height="480"></canvas>
      <div id="hud">loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
